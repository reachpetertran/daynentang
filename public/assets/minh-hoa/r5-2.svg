<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ngủ an toàn"><title>Ngủ an toàn</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngủ an toàn</text><rect x="60" y="60" width="200" height="90" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="3"/><rect x="70" y="120" width="180" height="22" rx="4" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2"/><circle cx="110" cy="108" r="12" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2"/><rect x="122" y="100" width="56" height="18" rx="8" fill="#5cae4f" stroke="#1b2a41" stroke-width="2"/><text x="160" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Nằm ngửa · mặt phẳng, cứng · không gối, chăn, thú bông</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b2a41" text-anchor="middle">Ngủ cùng phòng, không chung giường</text></svg>