<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Màn hình theo tuổi"><title>Màn hình theo tuổi</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Màn hình theo tuổi</text><rect x="14" y="44" width="94" height="110" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="61.0" y="76.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Dưới 2 tuổi</text><text x="61.0" y="89.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="61.0" y="102.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Không màn hình</text><text x="61.0" y="115.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">(gọi video</text><text x="61.0" y="128.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">với người thân)</text><rect x="116" y="44" width="94" height="110" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="163.0" y="76.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">2–4 tuổi</text><text x="163.0" y="89.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="163.0" y="102.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Tối đa 1 giờ</text><text x="163.0" y="115.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">mỗi ngày,</text><text x="163.0" y="128.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">ít hơn càng tốt</text><rect x="218" y="44" width="94" height="110" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="265.0" y="76.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Từ 5 tuổi</text><text x="265.0" y="89.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="265.0" y="102.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Theo kế hoạch</text><text x="265.0" y="115.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">gia đình, ngủ</text><text x="265.0" y="128.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">và vận động trước</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Theo WHO 2019 và AAP</text></svg>