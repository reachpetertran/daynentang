<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Sạc xe điện an toàn"><title>Sạc xe điện an toàn</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Sạc xe điện, điện thoại an toàn</text><circle cx="28" cy="51" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="55" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="38" width="260" height="26" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="54.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không sạc qua đêm, khi vắng người</text><circle cx="28" cy="85" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="89" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="72" width="260" height="26" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="88.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Dùng sạc, pin chính hãng</text><circle cx="28" cy="119" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="123" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="106" width="260" height="26" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="122.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không sạc gần đồ dễ cháy, lối thoát</text><circle cx="28" cy="153" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="157" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="140" width="260" height="26" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="156.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không tự độ pin, độ máy</text><text x="160" y="192" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#d9534f" text-anchor="middle">Có bình chữa cháy ở chỗ dễ lấy</text></svg>