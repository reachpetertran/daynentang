<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tin cảm giác"><title>Tin cảm giác</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Tin cảm giác "có gì đó sai"</text><rect x="14" y="40" width="292" height="30" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tim đập nhanh, muốn rời đi, thấy bị ép</text><line x1="160" y1="72" x2="160" y2="88" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,79.2 160,88 164.8,79.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="90" width="292" height="30" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="108.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không cần bằng chứng mới được rời đi</text><line x1="160" y1="122" x2="160" y2="138" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,129.2 160,138 164.8,129.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="140" width="292" height="30" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="158.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Rời đi sớm, tới chỗ đông người</text></svg>