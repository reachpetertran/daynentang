<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chấp nhận chưa hoàn hảo"><title>Chấp nhận chưa hoàn hảo</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi con làm chưa khéo</text><rect x="14" y="40" width="140" height="70" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Làm lại trước</text><text x="84.0" y="85.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">mặt con</text><text x="84" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">Con nghĩ: "mình</text><text x="84" y="144" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">làm cũng vô ích"</text><rect x="166" y="40" width="140" height="70" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Khen phần làm được,</text><text x="236.0" y="85.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">chỉ một bước</text><path d="M226 132 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Lần sau con giỏi hơn</text></svg>