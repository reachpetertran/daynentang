<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Vòng người có thể nhờ"><title>Vòng người có thể nhờ</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="20" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Vòng người có thể nhờ</text><circle cx="160" cy="110" r="80" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><circle cx="160" cy="110" r="54" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><circle cx="160" cy="110" r="28" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160" y="114" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhà mình</text><text x="160" y="74" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Họ hàng, hàng xóm</text><text x="160" y="46" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Trưởng thôn, trạm y tế</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Hội phụ nữ, trường, công an xã</text></svg>