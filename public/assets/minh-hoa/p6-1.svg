<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lo được hay không?"><title>Lo được hay không?</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Lo được hay không?</text><rect x="100" y="34" width="120" height="34" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="54.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Mình đang lo…</text><line x1="130" y1="70" x2="70" y2="94" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="76.4,86.3 70,94 79.9,95.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="190" y1="70" x2="250" y2="94" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="240.1,95.2 250,94 243.6,86.3" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="96" width="140" height="52" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="80.0" y="112.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Làm được gì đó</text><text x="80.0" y="125.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">→ lên kế hoạch</text><text x="80.0" y="139.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">(bài 7)</text><rect x="170" y="96" width="140" height="52" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="240.0" y="112.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không làm được</text><text x="240.0" y="125.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">→ neo lại, để ý</text><text x="240.0" y="139.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">nghĩ trôi qua</text><text x="160" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Hỏi: "Việc này mình làm được gì không?"</text></svg>