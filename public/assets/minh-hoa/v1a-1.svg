roke-linejoin="round"/><rect x="165.0" y="60" width="68.5" height="78" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="199.25" y="89.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">So sánh,</text><text x="199.25" y="102.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">hỏi</text><text x="199.25" y="116.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">"vì sao?"</text><line x1="235.5" y1="99.0" x2="241.5" y2="99.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="232.7,103.8 241.5,99.0 232.7,94.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="243.5" y="60" width="68.5" height="78" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="277.75" y="89.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chốt</text><text x="277.75" y="102.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">3–5</text><text x="277.75" y="116.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">giá trị</text><text x="160" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Tự chọn trước khi bàn, để ai cũng có tiếng nói</text></svg>