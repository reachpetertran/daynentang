<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Bị quấy rối: làm gì?"><title>Bị quấy rối: làm gì?</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Bị quấy rối: làm gì?</text><circle cx="32" cy="46" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="32" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><rect x="48" y="34" width="258" height="26" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="177.0" y="50.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói rõ: "Dừng lại."</text><circle cx="32" cy="80" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="32" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><rect x="48" y="68" width="258" height="26" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="177.0" y="84.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Rời đi, tới chỗ có người</text><circle cx="32" cy="114" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="32" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><rect x="48" y="102" width="258" height="26" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="177.0" y="118.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ghi lại: ngày, giờ, nơi, việc</text><circle cx="32" cy="148" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="32" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><rect x="48" y="136" width="258" height="26" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="177.0" y="152.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Báo người tin cậy, nơi phụ trách</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Không phải lỗi của bạn</text></svg>