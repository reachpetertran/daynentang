<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Dấu hiệu lừa đảo việc làm"><title>Dấu hiệu lừa đảo việc làm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Dấu hiệu lừa đảo việc làm</text><rect x="30" y="34" width="260" height="26" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="50.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc nhẹ, lương cao bất thường</text><rect x="30" y="66" width="260" height="26" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="82.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đòi đặt cọc, "phí hồ sơ"</text><rect x="30" y="98" width="260" height="26" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="114.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Mượn tài khoản, căn cước</text><rect x="30" y="130" width="260" height="26" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="146.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đe dọa, bắt giữ bí mật</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Dừng · không chuyển tiền · gọi người thân</text></svg>