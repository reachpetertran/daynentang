<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kế hoạch an toàn của tôi"><title>Kế hoạch an toàn của tôi</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Kế hoạch an toàn của tôi</text><rect x="40" y="34" width="240" height="150" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="58" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">1. Ba người tôi có thể nhờ</text><text x="58" y="88" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">2. Mật mã gọi đón</text><text x="58" y="114" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">3. Số khẩn cấp đã lưu</text><text x="58" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">4. Giấy tờ, tiền dự phòng ở đâu</text><text x="58" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">5. Nơi an toàn gần nhà, chỗ làm</text></svg>