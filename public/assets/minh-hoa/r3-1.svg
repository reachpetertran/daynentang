<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Gọi tên"><title>Gọi tên</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Gọi tên điều con thấy</text><g transform="translate(70 150) scale(1)"><ellipse cx="0" cy="-6" rx="18" ry="16" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><circle cx="0" cy="-34" r="14" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><path d="M-6 -48 q6 -6 10 0" stroke="#1b2a41" stroke-width="2" fill="none"/></g><rect x="120" y="40" width="186" height="34" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/><path d="M136 74 l-4 10 l12 -10" fill="#ffffff" stroke="#1b2a41" stroke-width="2" stroke-linejoin="round"/><rect x="133" y="72" width="14" height="4" fill="#ffffff"/><text x="213.0" y="61.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Cái thìa. Thìa màu xanh."</text><rect x="120" y="84" width="186" height="34" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/><path d="M136 118 l-4 10 l12 -10" fill="#ffffff" stroke="#1b2a41" stroke-width="2" stroke-linejoin="round"/><rect x="133" y="116" width="14" height="4" fill="#ffffff"/><text x="213.0" y="105.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Con đang gõ: cộc cộc!"</text><rect x="120" y="128" width="186" height="34" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/><path d="M136 162 l-4 10 l12 -10" fill="#ffffff" stroke="#1b2a41" stroke-width="2" stroke-linejoin="round"/><rect x="133" y="160" width="14" height="4" fill="#ffffff"/><text x="213.0" y="149.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#