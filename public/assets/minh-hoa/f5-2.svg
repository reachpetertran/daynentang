<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kiệt sức hay sốc nhiệt"><title>Kiệt sức hay sốc nhiệt</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Hai mức nguy hiểm</text><rect x="12" y="44" width="132" height="104" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="78.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Kiệt sức vì nóng</text><text x="78.0" y="86.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đau đầu, chóng</text><text x="78.0" y="99.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">mặt, buồn nôn,</text><text x="78.0" y="113.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">khát → nghỉ mát,</text><text x="78.0" y="126.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">uống nước</text><line x1="148" y1="96" x2="172" y2="96" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="163.2,100.8 172,96 163.2,91.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="176" y="44" width="132" height="104" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="242.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">SỐC NHIỆT</text><text x="242.0" y="86.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">lú lẫn, ngất,</text><text x="242.0" y="99.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">co giật → gọi</text><text x="242.0" y="113.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">115, làm mát</text><text x="242.0" y="126.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">ngay</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Lú lẫn là dấu hiệu cấp cứu</text></svg>