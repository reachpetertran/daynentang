<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Đồ chơi tự làm"><title>Đồ chơi tự làm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Đồ chơi tự làm</text><rect x="14" y="38" width="140" height="46" rx="10" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="58.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chai nhựa có nắp,</text><text x="84.0" y="71.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đựng hạt to: xóc</text><rect x="166" y="38" width="140" height="46" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="58.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hộp giấy:</text><text x="236.0" y="71.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">xếp chồng, bỏ vào</text><rect x="14" y="92" width="140" height="46" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="112.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Lá, que, đá to:</text><text x="84.0" y="125.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">xếp hàng, đếm</text><rect x="166" y="92" width="140" height="46" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="112.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Vải vụn:</text><text x="236.0" y="125.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">trốn tìm, ú òa</text><text x="160" y="164" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">Dưới 3 tuổi: không vật nhỏ lọt ống</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">giấy vệ sinh, dán chặt nắp chai</text></svg>