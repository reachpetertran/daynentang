<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mốc phát triển"><title>Mốc phát triển</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Mốc phát triển: để ý, không lo vội</text><rect x="14" y="40" width="292" height="50" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="61.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Mốc trong danh sách CDC là việc</text><text x="160.0" y="75.96000000000001" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">khoảng 75% trẻ cùng tuổi làm được</text><line x1="160" y1="92" x2="160" y2="108" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,99.2 160,108 164.8,99.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="112" width="292" height="50" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="133.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Con chưa làm được, hay mất kỹ năng đã có:</text><text x="160.0" y="147.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">hỏi bác sĩ nhi, đừng chờ</text></svg>