<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Trang ghi chú hai cột"><title>Trang ghi chú hai cột</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="20" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Trang ghi chú hai cột</text><rect x="40" y="32" width="240" height="150" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><line x1="110" y1="40" x2="110" y2="140" stroke="#1b2a41" stroke-width="2"/><line x1="48" y1="140" x2="272" y2="140" stroke="#1b2a41" stroke-width="2"/><text x="76" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b2a41" text-anchor="middle">Câu hỏi</text><text x="76" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">từ khóa</text><text x="190" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b2a41" text-anchor="middle">Ý chính</text><text x="190" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">bằng lời mình</text><text x="190" y="98" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">ví dụ, sơ đồ</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b2a41" text-anchor="middle">Tóm tắt 2–3 câu</text></svg>