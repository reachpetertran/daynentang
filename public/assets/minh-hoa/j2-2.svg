<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tập từ bước cuối"><title>Tập từ bước cuối</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Tập từ bước cuối</text><rect x="30" y="46" width="120" height="56" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="90.0" y="71.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Người thân</text><text x="90.0" y="84.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">làm bước 1–4</text><rect x="170" y="46" width="120" height="56" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="230.0" y="71.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Mình làm</text><text x="230.0" y="84.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">bước 5</text><line x1="152" y1="74" x2="168" y2="74" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="159.2,78.8 168,74 159.2,69.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="120" width="260" height="40" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="143.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Rồi mình làm bước 4–5, rồi 3–5…</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill