<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kế hoạch dùng thiết bị"><title>Kế hoạch dùng thiết bị</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Kế hoạch dùng thiết bị gia đình</text><rect x="14" y="40" width="142" height="54" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="71.14" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Giờ dùng</text><rect x="164" y="40" width="142" height="54" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="71.14" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chỗ không máy</text><rect x="14" y="104" width="142" height="54" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="135.14" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Sạc ngoài phòng ngủ</text><rect x="164" y="104" width="142" height="54" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="135.14" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Bố mẹ làm gương</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Cả nhà cùng theo, kể cả bố mẹ</text></svg>