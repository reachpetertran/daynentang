<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kể chuyện qua tranh"><title>Kể chuyện qua tranh</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Kể chuyện qua tranh, đổi lượt</text><rect x="10.0" y="50" width="67.5" height="70" rx="10" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><text x="43.75" y="82.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chỉ</text><text x="43.75" y="95.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">vào tranh</text><line x1="79.5" y1="85.0" x2="85.5" y2="85.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="76.7,89.8 85.5,85.0 76.7,80.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="87.5" y="50" width="67.5" height="70" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="121.25" y="82.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi:</text><text x="121.25" y="95.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">"Gì đây?"</text><line x1="157.0" y1="85.0" x2="163.0" y2="85.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="154.2,89.8 163.0,85.0 154.2,80.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="165.0" y="50" width="67.5" height="70" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="198.75" y="82.03" font-family="system-ui,-apple-sys