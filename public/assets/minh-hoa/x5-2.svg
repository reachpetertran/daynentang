<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chỗ tập thăng bằng"><title>Chỗ tập thăng bằng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chỗ tập thăng bằng an toàn</text><path d="M22 40 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Ghế nặng, dựa tường, hoặc bàn bếp chắc</text><path d="M22 68 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Nền khô, không thảm trơn; đi giày hoặc chân trần</text><path d="M22 96 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="106" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Có người ở gần lần đầu</text><path d="M22 124 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Đứng cạnh góc tường để có chỗ vịn hai phía</text><path d="M22 152 l6 6 l12 -13" fill="none" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Chóng mặt, mệt: không tập hôm nay</text></svg>