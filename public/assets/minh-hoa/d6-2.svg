<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi bạn chưa làm phần mình"><title>Khi bạn chưa làm phần mình</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi bạn chưa làm phần mình</text><rect x="14" y="40" width="92" height="84" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="60.0" y="65.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">1. Nhắc</text><text x="60.0" y="79.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">riêng, sớm</text><text x="60.0" y="92.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="60.0" y="106.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">kèm hạn mới</text><rect x="114" y="40" width="92" height="84" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">2. Hỏi</text><text x="160.0" y="72.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">cần giúp gì</text><text x="160.0" y="85.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="160.0" y="99.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">chia lại</text><text x="160.0" y="112.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">nếu cần</text><rect x="214" y="40" width="92" height="84" rx="10" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><text x="260.0" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">3. Báo</text><text x="260.0" y="72.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">giảng viên</text><text x="260.0" y="85.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="260.0" y="99.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">kèm bảng</text><text x="260.0" y="112.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">phân công</text><text x="160" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói về việc, không nói về người</text><text x="160" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Không làm thay, không đứng tên phần không làm</text></svg>