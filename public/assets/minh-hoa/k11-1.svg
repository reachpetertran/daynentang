<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Câu hỏi thử được"><title>Câu hỏi thử được</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="30" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Câu hỏi thử được</text><rect x="16" y="54" width="130" height="54" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="81.0" y="77.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Vì sao đá chìm?"</text><text x="81.0" y="91.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">(khó thử)</text><line x1="150" y1="81" x2="170" y2="81" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="161.2,85.8 170,81 161.2,76.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="174" y="54" width="130" height="54" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="239.0" y="77.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Nếu thả đá to và</text><text x="239.0" y="91.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">đá nhỏ thì sao?"</text><text x="160" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Câu "Nếu… thì…" cho mình làm thí nghiệm</text></svg>