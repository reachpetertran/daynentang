-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Còn thừa:</text><text x="198.75" y="87.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đậy, để</text><text x="198.75" y="101.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">chỗ mát</text><line x1="234.5" y1="84.0" x2="240.5" y2="84.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="231.7,88.8 240.5,84.0 231.7,79.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.5" y="46" width="67.5" height="76" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="276.25" y="74.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ăn lại:</text><text x="276.25" y="87.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đun sôi</text><text x="276.25" y="101.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">kỹ</text><text x="160" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">Đồ chín không để quá 2 giờ ở nhiệt độ phòng</text><text x="160" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngửi, nhìn thấy lạ: bỏ đi</text></svg>