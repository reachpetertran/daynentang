<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi nào cần tìm giúp"><title>Khi nào cần tìm giúp</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi nào cần tìm giúp</text><rect x="14" y="40" width="292" height="64" rx="10" fill="#f7c9c5" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="62.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Buồn chán, cáu gắt kéo dài nhiều tuần</text><text x="160.0" y="75.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Bỏ ăn, mất ngủ, rút khỏi bạn bè, bỏ học</text><text x="160.0" y="89.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói về cái chết hay làm hại bản thân</text><line x1="160" y1="108" x2="160" y2="124" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,115.2 160,124 164.8,115.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="128" width="292" height="50" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="149.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói chuyện với con, ở bên con</text><text x="160.0" y="163.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Gặp bác sĩ, chuyên gia. Khẩn cấp: 115</text></svg>