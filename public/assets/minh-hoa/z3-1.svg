<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Năm lúc cần rửa tay với xà phòng"><title>Năm lúc cần rửa tay với xà phòng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Năm lúc rửa tay với xà phòng</text><rect x="14" y="36" width="140" height="30" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="54.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Sau khi đi vệ sinh</text><rect x="166" y="36" width="140" height="30" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="54.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Sau khi lau rửa cho bé</text><rect x="14" y="74" width="140" height="30" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="92.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước khi nấu</text><rect x="166" y="74" width="140" height="30" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="92.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước khi ăn</text><rect x="89" y="112" width="142" height="30" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="130.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước khi cho con ăn</text><text x="160" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Xoa đủ lòng, mu, kẽ ngón, móng</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Không có vòi: dùng can treo, nước chảy</text></svg>