<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Giữ tiền an toàn"><title>Giữ tiền an toàn</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Giữ tiền an toàn</text><rect x="14" y="42" width="292" height="30" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="60.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Mã PIN, mã OTP: chỉ mình biết</text><rect x="14" y="82" width="292" height="30" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="100.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ai đòi giữ thẻ, giữ tiền: hỏi người tin cậy</text><rect x="14" y="122" width="292" height="30" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="140.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ghi tiền vào, tiền ra mỗi tuần</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Tiền của mình, mình quyết định</text></svg>