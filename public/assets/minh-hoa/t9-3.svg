<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Số giờ ngủ khuyến nghị theo tuổi"><title>Số giờ ngủ khuyến nghị theo tuổi</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngủ bao lâu mỗi ngày?</text><rect x="50" y="50" width="50" height="120" rx="6" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2"/><text x="75" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">1–2 tuổi</text><text x="75" y="44" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="middle">11–14 giờ</text><rect x="140" y="64" width="50" height="106" rx="6" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2"/><text x="165" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">3–5 tuổi</text><text x="165" y="58" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="middle">10–13 giờ</text><rect x="230" y="76" width="50" height="94" rx="6" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2"/><text x="255" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">6–12 tuổi</text><text x="255" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="middle">9–12 giờ</text><text x="160" y="198" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="8.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Theo khuyến nghị AASM 2016 (có tính giấc trưa cho trẻ nhỏ)</tex