<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tự kiểm tra thay vì đọc lại"><title>Tự kiểm tra thay vì đọc lại</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Tự kiểm tra</text><rect x="14" y="42" width="130" height="70" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="79.0" y="60.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đọc lại</text><text x="79.0" y="74.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="79.0" y="87.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">thấy quen,</text><text x="79.0" y="101.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">tưởng đã nhớ</text><rect x="176" y="42" width="130" height="70" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="241.0" y="60.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tự kiểm tra</text><text x="241.0" y="74.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="241.0" y="87.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gấp sách,</text><text x="241.0" y="101.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">tự nhớ ra</text><text x="160" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#f47b2a" text-anchor="middle">vs</text><text x="160" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhớ ra thấy khó là đang học</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Mức hữu ích cao (Dunlosky et al. 2013)</text></svg>