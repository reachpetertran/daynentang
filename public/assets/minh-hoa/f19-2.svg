<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Gặp người, giữ lửa"><title>Gặp người, giữ lửa</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Giữ quan hệ, việc nhỏ</text><rect x="10.0" y="38" width="145.0" height="34" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="82.5" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi thăm 1 người</text><rect x="165.0" y="38" width="145.0" height="34" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="237.5" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ăn chung bữa</text><rect x="10.0" y="80" width="145.0" height="34" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="82.5" y="100.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Giúp 1 việc nhỏ</text><rect x="165.0" y="80" width="145.0" height="34" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="237.5" y="100.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Rủ đi bộ, chơi thể thao</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Đều đặn hơn là nhiều</text></svg>