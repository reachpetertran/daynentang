<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Hồ sơ kỹ năng"><title>Hồ sơ kỹ năng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Hồ sơ kỹ năng</text><rect x="40" y="34" width="240" height="150" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="60" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">1. Kỹ năng đạt bậc 3</text><text x="60" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">2. Sản phẩm đã làm (mô tả, ảnh)</text><text x="60" y="122" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">3. Nhận xét của thầy, quản đốc</text><text x="60" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">4. Chứng chỉ (nếu có)</text></svg>