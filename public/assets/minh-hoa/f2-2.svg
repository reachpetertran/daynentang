<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Một ngày làm ca đêm"><title>Một ngày làm ca đêm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Một ngày làm ca đêm</text><rect x="10" y="60" width="120" height="40" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/><text x="70.0" y="85" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">Ca</text><rect x="130" y="60" width="30" height="40" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2"/><text x="145.0" y="85" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Về, tắm</text><rect x="160" y="60" width="120" height="40" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2"/><text x="220.0" y="85" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngủ ≥ 7 giờ</text><rect x="280" y="60" width="30" height="40" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2"/><text x="295.0" y="85" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc nhà</text><text x="160" y="130" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Giữ giờ ngủ giống nhau trong các ngày làm ca</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Ví dụ minh họa, không phải lịch bắt buộc</text></svg>