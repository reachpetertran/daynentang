<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi thấy người khác bị quấy rối"><title>Khi thấy người khác bị quấy rối</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi thấy người khác bị quấy rối</text><rect x="14" y="38" width="144" height="60" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="86.0" y="58.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Đánh lạc hướng</text><text x="86.0" y="71.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">"Chị ơi, mấy giờ</text><text x="86.0" y="84.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">rồi ạ?"</text><rect x="162" y="38" width="144" height="60" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="234.0" y="58.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhờ người khác</text><text x="234.0" y="71.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">bảo vệ, tài xế,</text><text x="234.0" y="84.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">quản lý</text><rect x="14" y="104" width="144" height="60" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="86.0" y="124.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Ghi lại</text><text x="86.0" y="137.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">nếu an toàn,</text><text x="86.0" y="150.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">đưa cho nạn nhân</text><rect x="162" y="104" width="144" height="60" rx="10" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><text x="234.0" y="131.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi han sau đó</text><text x="234.0" y="144.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">"Bạn ổn không?"</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Chọn việc an toàn cho chính bạn</text></svg>