<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chậm lại để nhận ra"><title>Chậm lại để nhận ra</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><rect x="16" y="62" width="132" height="76" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="82.0" y="96.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Đi nhanh</text><text x="82.0" y="111.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">thấy 1–2 điều</text><rect x="172" y="62" width="132" height="76" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="238.0" y="96.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Đi chậm</text><text x="238.0" y="111.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">thấy nhiều điều hơn</text><text x="160" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Chậm lại để nhận ra</text><text x="160" y="106" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="#f47b2a" text-anchor="middle">→</text><text x="160" y="164" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Con nghe thấy gì? Thấy gì? Chân cảm thấy gì?"</text></svg>