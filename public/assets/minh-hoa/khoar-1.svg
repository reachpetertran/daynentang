<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Giao và đáp"><title>Giao và đáp</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Giao và đáp như chuyền bóng</text><g transform="translate(44 150) scale(1.0)"><ellipse cx="0" cy="-6" rx="18" ry="16" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><circle cx="0" cy="-34" r="14" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><path d="M-6 -48 q6 -6 10 0" stroke="#1b2a41" stroke-width="2" fill="none"/></g><g transform="translate(282 170) scale(0.85)"><circle cx="0" cy="-78" r="14" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><path d="M-18 -60 h36 l4 44 h-44 z" fill="#2f86c9" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/><rect x="-14" y="-16" width="11" height="16" rx="3" fill="#1b2a41"/><rect x="3" y="-16" width="11" height="16" rx="3" fill="#1b2a41"/></g><path d="M64 96 Q162.0 56 260 96" fill="none" stroke="#f47b2a" stroke-width="3" stroke-dasharray="6 5"/><path d="M260 116 Q162.0 76 64 116" fill="none" stroke="#2f7d4a" stroke-width="3" stroke-dasharray="6 5"/><text x="160" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#f47b2a" text-anchor="middle">Con giao: "a… a…" + chỉ tay</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Bố mẹ đáp: "À, con chim!"</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Lặp lại nhiều lần mỗi ngày</text></svg>