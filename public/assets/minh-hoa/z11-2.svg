<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kế hoạch gia đình một trang"><title>Kế hoạch gia đình một trang</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Kế hoạch gia đình một trang</text><rect x="20" y="40" width="280" height="28" rx="10" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="57.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi có chuyện, cả nhà gặp nhau ở: ………</text><rect x="20" y="74" width="280" height="28" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="91.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Người đón con nếu bố mẹ vắng: ………</text><rect x="20" y="108" width="280" height="28" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="125.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Số gọi: 115 · 113 · 114 · 111 · trưởng thôn</text><rect x="20" y="142" width="280" height="28" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="159.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ai lo người già, người ốm: ………</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Dán chỗ cả nhà thấy, xem lại mỗi năm</text></svg>