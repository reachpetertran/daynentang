<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chia lương bốn phần"><title>Chia lương bốn phần</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Chia lương bốn phần</text><rect x="10" y="60" width="90" height="50" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="55.0" y="90" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Cố định</text><rect x="103" y="60" width="80" height="50" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="143.0" y="90" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Ăn uống</text><rect x="186" y="60" width="50" height="50" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2"/><text x="211.0" y="90" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Dự phòng</text><rect x="239" y="60" width="70" height="50" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2"/><text x="274.0" y="90" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Còn lại</text><text x="160" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tiền dự phòng chuyển ra trước khi tiêu</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Tỉ lệ minh họa, tùy nhà</text></svg>