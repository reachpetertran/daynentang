<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ba quy tắc ở gần nước"><title>Ba quy tắc ở gần nước</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ba quy tắc ở gần nước</text><rect x="14" y="38" width="292" height="36" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="59.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">1. Không bơi một mình, luôn có người lớn</text><rect x="14" y="82" width="292" height="36" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="103.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">2. Không xuống ao, hồ, sông, suối lạ</text><rect x="14" y="126" width="292" height="36" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="147.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">3. Thấy người đuối nước: gọi to, ném vật nổi</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Không tự nhảy xuống cứu</text></svg>