<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Năm câu hỏi trước việc mới"><title>Năm câu hỏi trước việc mới</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="26" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước việc mới, hỏi 5 câu</text><rect x="14" y="40" width="140" height="30" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="58.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">1. Có thể bị thương ra sao?</text><rect x="166" y="40" width="140" height="30" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="58.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">2. Cần đồ bảo hộ gì?</text><rect x="14" y="80" width="140" height="30" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="98.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">3. Đã được hướng dẫn?</text><rect x="166" y="80" width="140" height="30" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="98.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">4. Sự cố thì làm gì?</text><rect x="90" y="120" width="140" height="30" rx="10" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="138.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">5. Hỏi ai?</text><text x="160" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Chưa trả lời được thì chưa làm</text></svg>