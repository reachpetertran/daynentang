<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lịch bảo trì"><title>Lịch bảo trì</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Lịch bảo trì</text><rect x="24" y="32" width="272" height="158" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="40" y="60" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#f47b2a" text-anchor="start">Mỗi tháng</text><text x="126" y="60" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="start">Thử báo khói, xem bình chữa cháy</text><text x="40" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#f47b2a" text-anchor="start">Mỗi quý</text><text x="126" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="start">Kiểm ổ cắm, dây điện, van gas</text><text x="40" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#f47b2a" text-anchor="start">Mỗi năm</text><text x="126" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="start">Vệ sinh máy lạnh, bình nóng</text><text x="40" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#f47b2a" text-anchor="start">Trước mùa mưa</text><text x="126" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="start">Mái, máng nước, đồ cần kê cao</text></svg>