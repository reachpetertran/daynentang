<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Giữ lời và lòng tin"><title>Giữ lời và lòng tin</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><rect x="20" y="50" width="130" height="50" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Bố mẹ giữ lời</text><text x="85.0" y="85.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Chơi xong 5 phút"</text><rect x="170" y="50" width="130" height="50" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Con tin và chờ</text><text x="235.0" y="85.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">được lâu hơn</text><line x1="152" y1="75" x2="168" y2="75" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="159.2,79.8 168,75 159.2,70.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="32" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Người lớn giữ lời → con tin</text><rect x="20" y="120" width="130" height="50" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="141.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Bố mẹ hay quên</text><text x="85.0" y="155.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weigh