<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tám tuần"><title>Tám tuần</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Tám tuần</text><rect x="14" y="34" width="142" height="32" rx="10" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="53.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">1. Cơ thể đang lớn</text><rect x="164" y="34" width="142" height="32" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="53.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">2. Ranh giới cơ thể</text><rect x="14" y="74" width="142" height="32" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="93.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">3. An toàn trên mạng</text><rect x="164" y="74" width="142" height="32" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="93.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">4. Nhận ra lừa đảo</text><rect x="14" y="114" width="142" height="32" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="133.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">5. Bạn bè, bắt nạt</text><rect x="164" y="114" width="142" height="32" rx="10" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="133.96" font-family="system-ui,-apple-system,Se