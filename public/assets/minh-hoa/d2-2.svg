<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mình hay đoán thiếu thời gian"><title>Mình hay đoán thiếu thời gian</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Mình hay đoán thiếu thời gian</text><rect x="40" y="60" width="122" height="30" rx="6" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2"/><text x="101" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Dự đoán: 34 ngày</text><rect x="40" y="104" width="200" height="30" rx="6" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="140" y="124" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Thực tế: 55 ngày</text><text x="160" y="158" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Cách sửa: ước lượng rồi cộng thêm một nửa</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Theo Buehler, Griffin &amp; Ross 1994</text></svg>