<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Một ngày giúp giấc ngủ"><title>Một ngày giúp giấc ngủ</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Một ngày giúp giấc ngủ</text><rect x="10" y="44" width="70" height="92" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="45.0" y="80.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Sáng</text><text x="45.0" y="93.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">dậy đúng giờ,</text><text x="45.0" y="106.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">ra ánh sáng</text><rect x="86" y="44" width="70" height="92" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="121.0" y="80.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Chiều</text><text x="121.0" y="93.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">vận động,</text><text x="121.0" y="106.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">tránh cà phê</text><rect x="162" y="44" width="70" height="92" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="197.0" y="80.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Tối</text><text x="197.0" y="93.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">tắt màn hình</text><text x="197.0" y="106.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">trước khi ngủ</text><rect x="238" y="44" width="70" height="92" rx="10" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2.5"/><text x="273.0" y="80.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Đêm</text><text x="273.0" y="93.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">phòng tối,</text><text x="273.0" y="106.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">yên, mát</text><text x="160" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Người lớn: ngủ từ 7 giờ mỗi đêm</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Tuổi 15–17: 8–10 giờ</text></svg>