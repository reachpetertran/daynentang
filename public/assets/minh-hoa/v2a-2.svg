<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Nếu… thì…"><title>Nếu… thì…</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="26" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Kế hoạch "Nếu… thì…"</text><rect x="14" y="46" width="292" height="44" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="72.32" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Nếu con làm đổ nước và nói thật,</text><line x1="160" y1="92" x2="160" y2="110" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,101.2 160,110 164.8,101.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="114" width="292" height="44" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="132.89" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">thì bố mẹ nói: "Cảm ơn con đã nói thật.</text><text x="160.0" y="147.39" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Mình lau cùng nhé."</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Nghĩ trước câu nói, lúc bực vẫn nói đúng</text></svg>