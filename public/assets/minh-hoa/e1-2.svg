<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mức đạt đo được"><title>Mức đạt đo được</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Mức đạt đo được</text><rect x="14" y="40" width="140" height="62" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="61.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chưa rõ</text><text x="84.0" y="74.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">"May cho</text><text x="84.0" y="88.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đẹp hơn"</text><line x1="156" y1="71" x2="172" y2="71" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="163.2,75.8 172,71 163.2,66.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="174" y="40" width="132" height="62" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="240.0" y="61.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Đo được</text><text x="240.0" y="74.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">"1 mét đường thẳng,</text><text x="240.0" y="87.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">lệch ≤ 2 mm"</text><rect x="14" y="118" width="292" height="40" rx="10" fill="#f6c445" stroke="#1b2a4