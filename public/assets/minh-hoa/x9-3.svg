<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ba cách giảm té ngã"><title>Ba cách giảm té ngã</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ba cách giảm té ngã</text><rect x="14" y="40" width="92" height="104" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="60.0" y="75.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tập sức</text><text x="60.0" y="89.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">và thăng</text><text x="60.0" y="102.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">bằng đều</text><text x="60.0" y="116.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">(bài 4–5)</text><rect x="114" y="40" width="92" height="104" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="82.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhà an toàn</text><text x="160.0" y="95.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đèn, tay vịn,</text><text x="160.0" y="109.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">nền khô</text><rect x="214" y="40" width="92" height="104" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="260.0" y="75.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi thuốc,</text><text x="260.0" y="89.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">khám mắt</text><text x="260.0" y="102.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">khi hay</text><text x="260.0" y="116.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">chóng mặt</text><text x="160" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">Đã ngã một lần: nói với nhân viên y tế</text></svg>