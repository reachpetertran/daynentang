<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Thở chậm trên ghế"><title>Thở chậm trên ghế</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="26" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Thở chậm 1 phút trên ghế</text><rect x="10.0" y="50" width="67.5" height="64" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="43.75" y="79.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngồi thẳng</text><text x="43.75" y="92.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">thả vai</text><line x1="79.5" y1="82.0" x2="85.5" y2="82.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="76.7,86.8 85.5,82.0 76.7,77.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="87.5" y="50" width="67.5" height="64" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="121.25" y="79.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hít vào</text><text x="121.25" y="92.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">bằng mũi</text><line x1="157.0" y1="82.0" x2="163.0" y2="82.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="154.2,86.8 163.0,82.0 154.2,77.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="165.0" y="50" width="67.5" height="64" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="198.75" y="79.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Thở ra</text><text x="198.75" y="92.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">chậm, dài</text><line x1="234.5" y1="82.0" x2="240.5" y2="82.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="231.7,86.8 240.5,82.0 231.7,77.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.5" y="50" width="67.5" height="64" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="276.25" y="79.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Lặp lại</text><text x="276.25" y="92.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">5–6 lần</text><text x="160" y="146" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Khi tập sức: đếm to, thở đều, không nín thở</text><text x="160" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Chóng mặt thì dừng, thở bình thường</text></svg>