<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ôn giãn cách"><title>Ôn giãn cách</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ôn giãn cách</text><line x1="20" y1="100" x2="300" y2="100" stroke="#1b2a41" stroke-width="3"/><circle cx="30" cy="100" r="9" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="30" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Học</text><circle cx="80" cy="100" r="9" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="80" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">+1 ngày</text><circle cx="140" cy="100" r="9" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="140" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">+3 ngày</text><circle cx="210" cy="100" r="9" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="210" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">+1 tuần</text><circle cx="285" cy="100" r="9" fill="#f6c445" stroke="#1b2a41" stroke-width="2"/><text x="285" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">+3 tuần</text><text x="160" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Khoảng cách giãn dần</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Muốn nhớ càng lâu, khoảng ôn càng dài</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Lịch gợi ý, không phải con số cố định</text></svg>