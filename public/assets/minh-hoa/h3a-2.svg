<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Việc nhà và tiền"><title>Việc nhà và tiền</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc nhà và tiền</text><rect x="14" y="44" width="140" height="84" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="69.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc chung</text><text x="84.0" y="83.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">(dọn bàn, cất đồ)</text><text x="84.0" y="96.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="84.0" y="110.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không trả tiền</text><rect x="166" y="44" width="140" height="84" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="69.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc thêm</text><text x="236.0" y="83.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">(rửa xe, nhổ cỏ)</text><text x="236.0" y="96.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="236.0" y="110.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhà tự quyết</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Việc chung là phần của mỗi người trong nhà</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Mỗi nhà một cách; bằng chứng chưa rõ</text></svg>