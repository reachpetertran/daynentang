<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ảnh trên mạng và người thật"><title>Ảnh trên mạng và người thật</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ảnh trên mạng và người thật</text><rect x="30" y="40" width="110" height="110" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="85" y="64" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="middle">Ảnh đăng</text><text x="85" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">chọn góc đẹp</text><text x="85" y="102" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">lọc màu, chỉnh</text><text x="85" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">1 khoảnh khắc</text><rect x="180" y="40" width="110" height="110" rx="6" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="235" y="64" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="middle">Đời thật</text><text x="235" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">có ngày mệt</text><text x="235" y="102" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">có mụn, có lỗi</text><text x="235" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="500" fill="#1b2a41" text-anchor="middle">cả 24 giờ</text><text x="160" y="100" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="26" font-weight="800" fill="#f47b2a" text-anchor="middle">≠</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Đừng so cả đời mình với ảnh đẹp nhất của người khác</text></svg>