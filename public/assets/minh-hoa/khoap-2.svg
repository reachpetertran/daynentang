<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ba tầng chăm tâm trí"><title>Ba tầng chăm tâm trí</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ba tầng chăm tâm trí</text><rect x="20" y="40" width="280" height="40" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="57.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tự chăm mỗi ngày: ngủ, vận động,</text><text x="160.0" y="70.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">kết nối, việc nhỏ có ý nghĩa</text><rect x="40" y="88" width="240" height="40" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="105.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói với người tin cậy,</text><text x="160.0" y="118.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gặp nhân viên y tế</text><rect x="60" y="136" width="200" height="40" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="153.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nguy hiểm ngay:</text><text x="160.0" y="166.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gọi 115, tới cấp cứu</text><text x="160" y="192" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Khóa này dạy tầng 1 và chỉ đường tới tầng 2, 3</text></svg>