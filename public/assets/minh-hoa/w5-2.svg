<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi con hỏi ai đúng"><title>Khi con hỏi ai đúng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Câu nói khi con hỏi "Ai đúng?"</text><rect x="14" y="44" width="292" height="44" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="62.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Bố mẹ đang nghĩ khác nhau. Bố mẹ sẽ bàn</text><text x="160.0" y="76.96000000000001" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">và trả lời con sau bữa tối."</text><line x1="160" y1="92" x2="160" y2="112" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,103.2 160,112 164.8,103.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="116" width="292" height="44" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="141.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Sau đó: cùng nói với con một quyết định</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#d9534f" text-anchor="middle">Không nói "Hỏi mẹ mày ấy"</text></svg>