<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Nâng vật đúng cách"><title>Nâng vật đúng cách</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Nâng vật đúng cách</text><rect x="8.0" y="50" width="68.5" height="80" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="42.25" y="80.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Xem</text><text x="42.25" y="93.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">vật nặng</text><text x="42.25" y="107.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">cỡ nào</text><line x1="78.5" y1="90.0" x2="84.5" y2="90.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="75.7,94.8 84.5,90.0 75.7,85.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.5" y="50" width="68.5" height="80" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="120.75" y="87.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đứng gần,</text><text x="120.75" y="100.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gập gối</text><line x1="157.0" y1="90.0" x2="163.0" y2="90.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="154.2,94.8 163.0,90.0 154.2,85.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round