<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Thẻ hỏi – đáp tự làm"><title>Thẻ hỏi – đáp tự làm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Thẻ hỏi – đáp tự làm</text><rect x="30" y="44" width="120" height="90" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="90" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Mặt trước:</text><text x="90" y="98" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#f47b2a" text-anchor="middle">câu hỏi</text><rect x="170" y="44" width="120" height="90" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="230" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Mặt sau:</text><text x="230" y="98" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#2f7d4a" text-anchor="middle">câu trả lời</text><text x="160" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Tự hỏi mình, rồi lật thẻ xem</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Sai thì để thẻ lên trên, hỏi lại ngày mai</text></svg>