<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Năm nguy cơ trong nhà"><title>Năm nguy cơ trong nhà</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Năm nguy cơ trong nhà</text><rect x="14" y="38" width="142" height="62" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="65.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Nước</text><text x="85.0" y="79.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">xô, chậu, bể</text><rect x="164" y="38" width="142" height="62" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="65.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngã</text><text x="235.0" y="79.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">cầu thang, ban công</text><rect x="14" y="108" width="142" height="62" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="135.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Bỏng, lửa</text><text x="85.0" y="149.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">bếp, nước sôi, sạc</text><rect x="164" y="108" width="142" height="62" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="135.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngộ độc, hóc</text><text x="235.0" y="149.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">hóa chất, thuốc, đồ nhỏ</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">+ tủ, tivi đổ: bắt vít vào tường</text></svg>