<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi nào hỏi trước"><title>Khi nào hỏi trước</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi nhân viên y tế trước khi tập nếu</text><circle cx="26" cy="46" r="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="26" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="44" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Có bệnh tim, từng đau ngực khi gắng sức</text><circle cx="26" cy="74" r="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="26" y="78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="44" y="78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Vừa mổ, vừa ốm nặng, gãy xương, đột quỵ</text><circle cx="26" cy="102" r="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="26" y="106" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="44" y="106" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Hay chóng mặt, từng ngất, vừa bị ngã</text><circle cx="26" cy="130" r="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="26" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="44" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Huyết áp, đường huyết chưa ổn; tiêm insulin</text><circle cx="26" cy="158" r="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="26" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="44" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Khớp mới sưng, nóng, đỏ</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Có 1 ý "Có" → hỏi trước, rồi tập ở mức dễ</text></svg>