<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Bốn loại vận động"><title>Bốn loại vận động</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Bốn loại vận động</text><rect x="14" y="36" width="140" height="52" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="59.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Sức cơ</text><text x="84.0" y="72.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đứng lên, ngồi xuống</text><rect x="166" y="36" width="140" height="52" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="59.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Thăng bằng</text><text x="236.0" y="72.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đứng vịn ghế</text><rect x="14" y="96" width="140" height="52" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="119.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đi lại</text><text x="84.0" y="132.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đi bộ, việc nhà</text><rect x="166" y="96" width="140" height="52" rx="10" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="119.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Linh hoạt</text><text x="236.0" y="132.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">giãn cơ, xoay khớp</text><text x="160" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Và ngồi lì ít lại: mỗi giờ đứng dậy một lần</text></svg>