ke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="135.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Có cả việc mình làm (số đề, số giờ)</text><text x="160.0" y="148.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">và kết quả mong muốn (điểm số)</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Điểm còn phụ thuộc đề; việc làm thì do mình</text></svg>