<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Trước – trong – sau bão lũ"><title>Trước – trong – sau bão lũ</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước – Trong – Sau bão lũ</text><rect x="12.0" y="40" width="89.33333333333333" height="98" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="56.666666666666664" y="73.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Trước:</text><text x="56.666666666666664" y="86.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">túi khẩn cấp,</text><text x="56.666666666666664" y="99.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">nghe tin, gia</text><text x="56.666666666666664" y="112.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">cố nhà</text><line x1="103.33333333333333" y1="89.0" x2="113.33333333333333" y2="89.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="104.6,93.8 113.33333333333333,89.0 104.6,84.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="115.33333333333333" y="40" width="89.33333333333333" height="98" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="73.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Trong:</text><text x="160.0" y="86.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">nghe chính</text><text x="160.0" y="99.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">quyền, sơ tán</text><text x="160.0" y="112.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">khi được báo</text><line x1="206.66666666666666" y1="89.0" x2="216.66666666666666" y2="89.0" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="207.9,93.8 216.66666666666666,89.0 207.9,84.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="218.66666666666666" y="40" width="89.33333333333333" height="98" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="263.3333333333333" y="73.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Sau:</text><text x="263.3333333333333" y="86.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">chờ nước rút,</text><text x="263.3333333333333" y="99.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">đun sôi nước,</text><text x="263.3333333333333" y="112.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">tránh dây điện</text><text x="160" y="164" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d9534f" text-anchor="middle">Không lội, không bơi qua dòng nước chảy xiết</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Trẻ em luôn trong tầm tay người lớn</text></svg>