<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mục tiêu đo được"><title>Mục tiêu đo được</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Mục tiêu đo được</text><rect x="14" y="42" width="292" height="34" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="62.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chưa rõ: "Mình muốn tự lập hơn."</text><line x1="160" y1="80" x2="160" y2="96" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="155.2,87.2 160,96 164.8,87.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="98" width="292" height="52" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="121.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Rõ: "Sau 4 tuần, mình tự pha mì</text><text x="160.0" y="134.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gói, chỉ cần nhắc 1 lần."</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Ai, làm gì, tới khi nào, giúp bao nhiêu</text></svg>