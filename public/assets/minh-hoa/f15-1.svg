<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tử tế nơi làm"><title>Tử tế nơi làm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Tử tế nơi làm</text><rect x="10.0" y="38" width="145.0" height="34" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="82.5" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chỉ việc người mới</text><rect x="165.0" y="38" width="145.0" height="34" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="237.5" y="58.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Cảm ơn cụ thể</text><rect x="10.0" y="80" width="145.0" height="34" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="82.5" y="100.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Không cười cợt, bêu xấu</text><rect x="165.0" y="80" width="145.0" height="34" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="237.5" y="100.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Thấy bắt nạt: báo</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Nhỏ, đều, ai cũng làm được</text></svg>