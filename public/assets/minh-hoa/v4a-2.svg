<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Bốn luật họp"><title>Bốn luật họp</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Luật của cuộc họp</text><circle cx="28" cy="56" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="28" y="60" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><rect x="46" y="42" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="59.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Một người nói, cả nhà nghe</text><circle cx="28" cy="92" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="28" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><rect x="46" y="78" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="95.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Không chê, không trách</text><circle cx="28" cy="128" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="28" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><rect x="46" y="114" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="131.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Chuyện khó: bố mẹ bàn riêng trước</text><circle cx="28" cy="164" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="28" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><rect x="46" y="150" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="167.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Hết giờ là dừng</text></svg>