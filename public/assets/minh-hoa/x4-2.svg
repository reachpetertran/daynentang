<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ba mức động tác ghế"><title>Ba mức động tác ghế</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ba mức của động tác ghế</text><rect x="14" y="40" width="92" height="110" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="60.0" y="66.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Dễ</text><text x="60.0" y="79.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="60.0" y="92.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Chống tay</text><text x="60.0" y="105.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">lên tay ghế</text><text x="60.0" y="118.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">hoặc đùi;</text><text x="60.0" y="131.1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">ghế cao</text><rect x="114" y="40" width="92" height="110" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="72.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Vừa</text><text x="160.0" y="85.6" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle