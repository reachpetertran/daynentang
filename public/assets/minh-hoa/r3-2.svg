<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Kể việc đang làm"><title>Kể việc đang làm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói to việc mình làm</text><rect x="14" y="40" width="292" height="34" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="60.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Mẹ rửa rau. Nước chảy róc rách."</text><rect x="14" y="84" width="292" height="34" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="104.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Bố bế con. Mình đi ra sân."</text><rect x="14" y="128" width="292" height="34" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="148.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">"Áo này ướt. Mình thay áo khô."</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#2f7d4a" text-anchor="middle">Như kể bình luận trận bóng</text></svg>