<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mười một bài"><title>Mười một bài</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="20" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Mười một bài</text><rect x="14" y="28" width="142" height="24" rx="10" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="43.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">1. Học bằng giấy bút</text><rect x="164" y="28" width="142" height="24" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="43.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">2. Nước uống an toàn</text><rect x="14" y="57" width="142" height="24" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">3. Rửa tay, tiêu chảy</text><rect x="164" y="57" width="142" height="24" rx="10" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">4. Ăn đủ, giữ đồ ăn</text><rect x="14" y="86" width="142" height="24" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="101.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">5. Lửa, khói, đèn</text><rect x="164" y="86" width="142" height="24" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="101.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">6. Sơ cứu tay không</text><rect x="14" y="115" width="142" height="24" rx="10" fill="#c9b6e8" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="130.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">7. Chơi với con</text><rect x="164" y="115" width="142" height="24" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="130.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">8. Chữ và số cùng con</text><rect x="14" y="144" width="142" height="24" rx="10" fill="#f3e3c3" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="159.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">9. Sổ thu chi giấy</text><rect x="164" y="144" width="142" height="24" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="159.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">10. Bão lũ, mất điện</text><rect x="89" y="175" width="142" height="22" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="189.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">11. Người có thể nhờ</text></svg>