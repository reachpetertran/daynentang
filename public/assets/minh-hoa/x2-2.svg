<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Chia nhỏ thời gian ngồi"><title>Chia nhỏ thời gian ngồi</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b2a41" text-anchor="middle">Cùng 8 giờ ngồi, hai cách</text><text x="76" y="48" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Ngồi liền một mạch</text><rect x="20" y="58" width="112" height="22" rx="4" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><text x="240" y="48" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chia nhỏ, đứng dậy</text><rect x="184" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="198" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="212" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="226" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="240" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="254" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="268" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="282" y="58" width="10" height="22" rx="2" fill="#cfe6c4" stroke="#1b2a41" stroke-width="1.5"/><rect x="20" y="104" width="280" height="50" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="126.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc nhỏ: đứng khi nghe điện thoại, tự đi lấy nước,</text><text x="160.0" y="139.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đứng dậy mỗi lần hết một tập phim</text><text x="160" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Ít ngồi lì hơn là bước đầu, ai cũng làm được</text></svg>