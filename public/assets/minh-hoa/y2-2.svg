<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Con tự kể"><title>Con tự kể</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Con tự kể hay bị hỏi tra?</text><rect x="14" y="40" width="140" height="100" rx="10" fill="#d9dde3" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="72.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Hỏi tra, theo dõi</text><text x="84.0" y="86.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">lén, mắng ngay</text><text x="84.0" y="100.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="84.0" y="114.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">→ con giấu</text><rect x="166" y="40" width="140" height="100" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="72.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Lắng nghe, bình</text><text x="236.0" y="86.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">tĩnh, tôn trọng</text><text x="236.0" y="100.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="236.0" y="114.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">→ con tự kể</text><text x="160" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Bố mẹ biết về con chủ yếu nhờ con kể</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Theo Kerr và Stattin 2000 (nghiên cứu liên hệ)</text></svg>