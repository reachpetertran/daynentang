<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Việc tốt cho cộng đồng"><title>Việc tốt cho cộng đồng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc tốt cho cộng đồng</text><rect x="14" y="40" width="142" height="56" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhặt rác ở xóm</text><rect x="164" y="40" width="142" height="56" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="71.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Tặng sách cũ</text><rect x="14" y="106" width="142" height="56" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="85.0" y="137.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Thăm người già neo đơn</text><rect x="164" y="106" width="142" height="56" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="235.0" y="137.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Góp quỹ lớp, quỹ xóm</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Con chọn việc, bố mẹ làm cùng</text></svg>