<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Đĩa ăn đủ nhóm"><title>Đĩa ăn đủ nhóm</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Một bữa đủ nhóm</text><circle cx="160" cy="108" r="66" fill="#ffffff" stroke="#1b2a41" stroke-width="3"/><path d="M160 108 L160 42 A66 66 0 0 1 217 141 Z" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2"/><path d="M160 108 L217 141 A66 66 0 0 1 103 141 Z" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2"/><path d="M160 108 L103 141 A66 66 0 0 1 160 42 Z" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2"/><text x="186" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Cơm, ngô,</text><text x="186" y="105" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">khoai</text><text x="160" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Cá, trứng, đậu,</text><text x="160" y="163" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">thịt, tôm</text><text x="132" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">Rau,</text><text x="132" y="105" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#1b2a41" text-anchor="middle">quả</text><text x="160" y="192" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#2f7d4a" text-anchor="middle">Uống nước sạch, ít muối, ít đường</text></svg>