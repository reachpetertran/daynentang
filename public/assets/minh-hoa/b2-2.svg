<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Khi hai giá trị kéo hai phía"><title>Khi hai giá trị kéo hai phía</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi hai giá trị kéo hai phía</text><rect x="14" y="44" width="120" height="50" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="74.0" y="66.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Trung thực</text><text x="74.0" y="79.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">nói thật điểm kém</text><rect x="186" y="44" width="120" height="50" rx="10" fill="#f2a7a0" stroke="#1b2a41" stroke-width="2.5"/><text x="246.0" y="66.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Giữ hòa khí</text><text x="246.0" y="79.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">sợ bố mẹ buồn</text><line x1="136" y1="69" x2="184" y2="69" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="175.2,73.8 184,69 175.2,64.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="184" y1="75" x2="136" y2="75" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="144.8,70.2 136,75 144.8,79.8" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="118" width="200" height="44" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="160.0" y="137.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Cách giữ cả hai:</text><text x="160.0" y="150.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">nói thật, kèm kế hoạch sửa</text><text x="160" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Không có đáp án hoàn hảo, chỉ có cách tốt hơn</text></svg>