<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Cần hay muốn"><title>Cần hay muốn</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Cần hay muốn?</text><rect x="12" y="44" width="132" height="104" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="78.0" y="79.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">CẦN</text><text x="78.0" y="93.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">ăn, ở, đi làm,</text><text x="78.0" y="106.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">thuốc, tiền</text><text x="78.0" y="120.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">gửi về nhà</text><line x1="148" y1="96" x2="172" y2="96" stroke="#f47b2a" stroke-width="3" stroke-linecap="round"/><polyline points="163.2,100.8 172,96 163.2,91.2" fill="none" stroke="#f47b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="176" y="44" width="132" height="104" rx="10" fill="#f6d9a8" stroke="#1b2a41" stroke-width="2.5"/><text x="242.0" y="79.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">MUỐN</text><text x="242.0" y="93.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">đồ thích,</text><text x="242.0" y="106.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">ăn ngoài,</text><text x="242.0" y="120.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">có cũng được</text><text x="160" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="middle">Muốn thì chờ 1 ngày rồi quyết</text></svg>