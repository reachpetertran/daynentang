<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Đứng dậy sau khi ngã"><title>Đứng dậy sau khi ngã</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="18" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Khi bị ngã: đứng dậy từ từ</text><circle cx="26" cy="38" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="44" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Nằm yên, thở, tự kiểm tra đau</text><circle cx="26" cy="64" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="68" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="44" y="68" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Lăn nghiêng người</text><circle cx="26" cy="90" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="44" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Chống tay và gối</text><circle cx="26" cy="116" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="44" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Bò tới ghế chắc</text><circle cx="26" cy="142" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="146" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="44" y="146" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Một chân lên, vịn ghế đứng dậy</text><circle cx="26" cy="168" r="10" fill="#f47b2a" stroke="#1b2a41" stroke-width="2"/><text x="26" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="44" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="start">Ngồi nghỉ, báo người nhà</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#d9534f" text-anchor="middle">Đau đầu, hông, lưng, cổ: không cố dậy, gọi 115</text></svg>