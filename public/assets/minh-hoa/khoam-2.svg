<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Ba khối nền về tiền"><title>Ba khối nền về tiền</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Ba khối nền về tiền của trẻ</text><rect x="14" y="120" width="92" height="50" rx="6" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="60.0" y="142.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Chờ đợi,</text><text x="60.0" y="155.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">tự kiểm soát</text><text x="60" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">3–5 tuổi</text><rect x="116" y="90" width="92" height="80" rx="6" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="162.0" y="120.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Thói quen</text><text x="162.0" y="133.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">tiền bắt đầu</text><text x="162.0" y="147.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">hình thành</text><text x="162" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">6–12 tuổi</text><rect x="218" y="60" width="92" height="110" rx="6" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="264.0" y="112.03" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Hiểu biết,</text><text x="264.0" y="125.53" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">ra quyết định</text><text x="264" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">13–21 tuổi</text></svg>