<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Việc sai khác với con người"><title>Việc sai khác với con người</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><rect x="20" y="60" width="120" height="70" rx="10" fill="#fde3cf" stroke="#1b2a41" stroke-width="2.5"/><text x="80.0" y="91.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc con làm</text><text x="80.0" y="106.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">(làm đổ nước)</text><rect x="180" y="60" width="120" height="70" rx="10" fill="#cfe6c4" stroke="#1b2a41" stroke-width="2.5"/><text x="240.0" y="91.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Con là ai</text><text x="240.0" y="106.82" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">(con vẫn ngoan)</text><text x="160" y="102" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="30" font-weight="600" fill="#d9534f" text-anchor="middle">≠</text><text x="160" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Việc sai ≠ con người xấu</text><text x="160" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#1b2a41" text-anchor="middle">Bố mẹ chê việc, không chê con</text></svg>