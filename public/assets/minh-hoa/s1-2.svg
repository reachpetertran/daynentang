<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tư thế và giọng nói"><title>Tư thế và giọng nói</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Tư thế và giọng nói</text><rect x="14" y="40" width="140" height="112" rx="10" fill="#9fd0f0" stroke="#1b2a41" stroke-width="2.5"/><text x="84.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Đứng vững</text><text x="84.0" y="86.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">hai chân rộng</text><text x="84.0" y="99.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">bằng vai</text><text x="84.0" y="113.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle"></text><text x="84.0" y="126.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nhìn thẳng</text><rect x="166" y="40" width="140" height="112" rx="10" fill="#f6c445" stroke="#1b2a41" stroke-width="2.5"/><text x="236.0" y="72.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">Nói chậm,</text><text x="236.0" y="86.28" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1b2a41" text-anchor="middle">rõ, đủ to</text><text x="236.0" y="99.78" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="