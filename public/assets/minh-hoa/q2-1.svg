<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mạng lưới giúp nhau"><title>Mạng lưới giúp nhau</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Danh sách người có thể nhờ</text><rect x="30" y="32" width="260" height="158" rx="6" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="46" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="start">Đón con khi kẹt</text><text x="274" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="end">Cô Hoa (hàng xóm)</text><text x="46" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="start">Trông con 1 buổi</text><text x="274" y="94" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="end">Bà nội</text><text x="46" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="start">Sửa điện</text><text x="274" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="end">Chú Nam</text><text x="46" y="158" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b2a41" text-anchor="start">Hỏi chuyện học</text><text x="274" y="158" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2f7d4a" text-anchor="end">Cô giáo chủ nhiệm</text><text x="160" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#8a8f98" text-anchor="middle">Tên trong hình là ví dụ</text></svg>