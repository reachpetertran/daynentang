<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="An toàn trên mạng"><title>An toàn trên mạng</title><rect width="320" height="200" rx="16" fill="#fbf3e4"/><text x="160" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b2a41" text-anchor="middle">Dấu hiệu người lạ trên mạng</text><circle cx="28" cy="52" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="56" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="38" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="55.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Khen quá mức, tặng quà</text><circle cx="28" cy="88" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="74" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="91.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Đòi giữ bí mật với bố mẹ</text><circle cx="28" cy="124" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="110" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="127.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Xin ảnh riêng tư</text><circle cx="28" cy="160" r="11" fill="#d9534f" stroke="#1b2a41" stroke-width="2"/><text x="28" y="164" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><rect x="46" y="146" width="260" height="28" rx="10" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5"/><text x="176.0" y="163.96" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#1b2a41" text-anchor="middle">Rủ gặp riêng</text><text x="160" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#d9534f" text-anchor="middle">Thấy một dấu hiệu: chặn, chụp lại, kể bố mẹ</text></svg>