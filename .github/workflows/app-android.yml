name: App Android (bản thử)
on:
  push:
    branches: [app]
    paths: ['app/**', 'public/**', '.github/workflows/app-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Sinh nội dung app từ website
        run: python3 app/build_www.py
      - name: Cài Capacitor và đồng bộ
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Build APK bản thử
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../day-nen-tang-ban-thu.apk
      - uses: actions/upload-artifact@v4
        with: { name: day-nen-tang-ban-thu, path: day-nen-tang-ban-thu.apk }
